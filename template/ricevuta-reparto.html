<html>

<head>
	<style type="text/css">
		.mt-10 {
			margin-top: 10px;		
		}
		.full-width {
			width: 100%;		
		}
		.text-right {
			text-align: right;		
		}
		.progressivo {
			font-size: 3em;
			border: 3px solid black;
			border-radius: 10px;
			padding: 10px;		
			float: right;
			text-align: center;
			font-weight: bold;
		}
		.spacer {
			width: 10%;		
		}
		.col-sx, .col-dx {
			width: 45%;		
		}
		
		table#dettaglio td {
			border-top: 1px solid black;		
		}
		table#dettaglio {
			border-bottom: 3px solid black;
			width: 100%;
		}
		#dettaglio-header {
			font-weight: bold;		
		}
		.qnt {
			width: 20%;		
		}
		.pronome {
			width: 80%;
		}
		.maiuscolo {
			text-transform: uppercase;		
		}
		
		.big {
			font-size: 20px;		
		}
	</style>
</head>

<body>

<div class="container">

<div id="header">
<table class="full-width">
	<tr>
		<td colspan="3" class="text-right">{{nome-cassa}} [{{id-testata}}] {{data-ora}}</td>
	</tr>
	<tr class="row">
		<td class="col-xs-6 col-sx big">
				<span id="tavolo">Tavolo: {{tavolo}}<br></span>
				<span id="cliente">Cliente: {{cliente}}<br></span>
				<span>Tipo: <strong>{{tipo}}</strong><br></span>
				<span>Coperti: <strong>{{coperti}}</strong></span>
		</td>
		<td class="spacer">
			&nbsp;
		</td>
		<td class="col-xs-6 col-dx text-right">
			<h5>Progressivo:</h5>
			<div class="progressivo">{{progressivo}}</div>
		</td>
	</tr>
</table>
</div>
<!--<hr />-->

<div id="main">
	<table id="dettaglio" class="big">
		<tr id="dettaglio-header"><th class="qnt">Qnt</th><th class="pronome">Prodotto</th></tr>
		<tr class="prodotto"><td class="qnt"><strong>{{quantita-prodotto}}</strong></td><td class="pronome">{{nome-prodotto-corto}} {{nota-prodotto}}</td></tr>
	</table>
	&nbsp;
	<div id="note" class="big" border="4" bgcolor="#EEEEEE">{{note-testata}}</div>
</div>

<!--<hr />-->

<div id="footer">
	<strong class="maiuscolo big text-right">RICEVUTA {{tipo-ricevuta}}</strong>	
</div>

</div>

</body>

</html>
